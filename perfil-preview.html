<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Penya · Perfil de prueba</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f8;color:#172c55;font:16px system-ui}header{background:#07152d;color:white;padding:18px;border-bottom:5px solid #a71942;display:flex;align-items:center;gap:12px}header img{width:48px}main{max-width:560px;margin:auto;padding:16px}section{background:white;border:1px solid #dce3ed;border-radius:16px;padding:18px;margin-bottom:16px}h1,h2{margin:0 0 12px}h1{font-size:22px}h2{font-size:18px}label{display:block;font-weight:650;margin:14px 0 6px}input:not([type=checkbox]),select,button{width:100%;font:inherit;padding:12px;border-radius:9px;border:1px solid #aebdd0;background:#f8fafc;color:#172c55}button{background:#19569b;color:white;font-weight:bold;margin-top:18px;border:0}a{color:#19569b}small{display:block;color:#475569}label.check{font-weight:400;display:flex;gap:10px;align-items:center}input[type=checkbox]{width:20px;height:20px}#preview{background:#edf3fb;padding:16px;border-radius:12px;display:flex;justify-content:space-between;gap:12px;overflow-wrap:anywhere}#status{min-height:24px} .notice{background:#fff5d8;padding:12px;border-radius:10px}</style></head><body><header><img src="https://penyabarcelonistasvh.github.io/Penya-Barcelonista/pbsv-crest.png" alt=""><div><b>Fantasy Penya</b><br>Perfil de participante</div></header><main><p><a href="./index.html">← Volver al Fantasy</a></p><p class="notice">Demostración independiente. Utiliza datos ficticios. No se guarda ni se envía información.</p><section><h1>Mi perfil Fantasy</h1><form id="form"><label for="alias">Nombre de mi equipo Fantasy</label><input id="alias" maxlength="36" required placeholder="Penya United"><label for="firstName">Nombre de pila</label><input id="firstName" maxlength="40" required><label for="lastName">Apellidos (privados)</label><input id="lastName" maxlength="80" required><label for="role">Vinculación con el club</label><select id="role" required></select><label for="team">Equipo del club</label><select id="team" required></select><h2 style="margin-top:24px">Privacidad</h2><label class="check"><input type="checkbox" id="showName">Mostrar mi nombre de pila</label><label class="check"><input type="checkbox" id="showTeam">Mostrar mi equipo del club</label><small>Los apellidos nunca aparecen en la clasificación.</small><button type="submit">Validar perfil de prueba</button><p id="status" role="status"></p></form></section><section><h2>Vista previa de clasificación</h2><div id="preview"><div><b id="previewAlias">Mi equipo Fantasy</b><small id="previewDetails"></small></div><b>0 pts</b></div></section></main><script type="module">import {CLUB_TEAMS,ROLES,validateProfile,publicProfile} from './participant-profile.js';const el=id=>document.getElementById(id);for(const [id,values] of [['role',ROLES],['team',CLUB_TEAMS]]){el(id).add(new Option('Selecciona una opción',''));for(const v of values)el(id).add(new Option(v,v));}function data(){return Object.fromEntries(['alias','firstName','lastName','role','team','showName','showTeam'].map(k=>[k,el(k).type==='checkbox'?el(k).checked:el(k).value]));}function preview(){const p=data();el('previewAlias').textContent=p.alias.trim()||'Mi equipo Fantasy';el('previewDetails').textContent=[p.showName?p.firstName.trim():'',p.showTeam?(p.role==='Invitado'&&p.team==='Sin equipo asignado'?'Invitado':p.team):''].filter(Boolean).join(' · ');}el('form').addEventListener('input',()=>{el('status').textContent='';preview()});el('role').addEventListener('change',()=>{if(el('role').value==='Invitado'&&!el('team').value)el('team').value='Sin equipo asignado';preview()});el('form').addEventListener('submit',e=>{e.preventDefault();try{const p=publicProfile(validateProfile(data()));el('previewAlias').textContent=p.alias;el('previewDetails').textContent=[p.firstName,p.team].filter(Boolean).join(' · ');el('status').textContent='Perfil válido. Demostración: no se ha guardado.';}catch(err){el('status').textContent=err.message;}});</script></body></html>
